<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PocketPilot</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="spa-layout">
    <!-- Desktop/Tablet Sidebar -->
    <aside class="sidebar" aria-label="Sidebar">
      <a class="brand" href="app.html">
        <span class="brand-mark">
          <img class="brand-logo" src="assets/logo.png" alt="PocketPilot Logo" width="237" height="241" />
        </span>
        <span class="brand-name">PocketPilot</span>
      </a>
      
      <nav class="sidebar-nav" aria-label="Primary">
        <a class="nav-link" href="app.html" data-route="dashboard">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
          <span class="nav-label">Dashboard</span>
        </a>
        <a class="nav-link" href="app.html?view=transactions" data-route="transactions">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3h16v18l-3-2-3 2-3-2-3 2-3-2-1 2Z"/><path d="M8 8h8M8 12h8M8 16h4"/></svg>
          <span class="nav-label">Transactions</span>
        </a>
        <a class="nav-link" href="app.html?view=budget" data-route="budget">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v0"/></svg>
          <span class="nav-label">Budget</span>
        </a>
        <a class="nav-link" href="app.html?view=goals" data-route="goals">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
          <span class="nav-label">Goals</span>
        </a>
        <a class="nav-link" href="app.html?view=insights" data-route="insights">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
          <span class="nav-label">Insights</span>
        </a>
        <a class="nav-link" href="app.html?view=chat" data-route="chat">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span class="nav-label">AI Copilot</span>
        </a>
      </nav>
      
      <div class="sidebar-spacer"></div>
      
      <nav class="sidebar-nav sidebar-secondary">
        <a class="nav-link" href="app.html?view=settings" data-route="settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          <span class="nav-label">Settings</span>
        </a>
      </nav>
      
      <div class="sidebar-user">
        <details class="profile-menu">
          <summary class="profile-trigger" title="Your profile">
            <span class="profile-avatar" aria-hidden="true"></span>
            <span class="sidebar-user-name" id="sidebar-user-name">Your account</span>
            <svg class="profile-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </summary>
          <div class="profile-dropdown">
            <a class="profile-dropdown-item is-signout" href="login.html" id="sidebar-signout">Sign out</a>
          </div>
        </details>
      </div>
    </aside>

    <div class="main-wrapper">
      <!-- Top Bar -->
      <header class="top-bar">
        <div class="top-bar-left">
          <h1 class="top-bar-title" id="top-bar-title">Dashboard</h1>
          <span class="top-bar-subtitle" id="top-bar-subtitle"></span>
        </div>
        <div class="top-bar-right" id="top-bar-actions">
          <span class="profile-avatar mobile-only-avatar" id="mobile-avatar" aria-hidden="true"></span>
        </div>
      </header>

      <!-- Dynamic Content Area -->
      <main class="spa-main" id="app-content">
        <!-- Views injected here -->
      </main>
    </div>

    <!-- Mobile Bottom Navigation -->
    <nav class="bottom-nav">
      <a class="bottom-nav-item" href="app.html" data-route="dashboard">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        <span>Home</span>
      </a>
      <a class="bottom-nav-item" href="app.html?view=transactions" data-route="transactions">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3h16v18l-3-2-3 2-3-2-3 2-3-2-1 2Z"/><path d="M8 8h8M8 12h8M8 16h4"/></svg>
        <span>Ledger</span>
      </a>
      <a class="bottom-nav-item bottom-nav-add" href="app.html?view=payment" data-route="payment">
        <div class="add-btn-fab">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        </div>
      </a>
      <a class="bottom-nav-item" href="app.html?view=insights" data-route="insights">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
        <span>Insights</span>
      </a>
      <a class="bottom-nav-item" href="app.html?view=chat" data-route="chat">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>AI</span>
      </a>
    </nav>
  </div>

  <!-- SPA Templates -->
  <template id="tpl-dashboard">
    <div class="dashboard-hero card" style="text-align: center; padding: 48px 24px; background: linear-gradient(180deg, var(--color-bg-elevated) 0%, rgba(26, 32, 28, 0) 100%);">
      <h2 class="page-eyebrow">Safe to spend today</h2>
      <div class="hero-amount" style="font-family: var(--font-display); font-size: 3.5rem; color: var(--color-gold); font-weight: 500; margin: 16px 0;" id="dash-safe-to-spend">₹0</div>
      <p class="hero-sub" style="color: var(--color-ink-muted);" id="dash-days-left">0 days left in cycle</p>
    </div>

    <div class="dashboard-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; margin-top: 24px;">
      <!-- Breakdown -->
      <div class="card">
        <h3 class="section-heading">Allowance Breakdown</h3>
        <div class="progress-wrapper" style="margin: 16px 0;">
          <div class="progress-bar" style="height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; display: flex;">
            <div id="dash-progress-fixed" style="width: 0%; background: var(--color-ink-muted);"></div>
            <div id="dash-progress-flexible" style="width: 0%; background: var(--color-primary);"></div>
          </div>
        </div>
        <div class="summary-grid">
          <div class="summary-item">
            <div class="summary-item-label">Flexible</div>
            <div class="summary-item-value" id="dash-flexible" style="color: var(--color-primary);">₹0</div>
          </div>
          <div class="summary-item">
            <div class="summary-item-label">Fixed Costs</div>
            <div class="summary-item-value" id="dash-fixed">₹0</div>
          </div>
        </div>
      </div>

      <!-- What-if Simulator -->
      <div class="card">
        <h3 class="section-heading">What-if Simulator</h3>
        <p class="field-help" style="margin-bottom: 16px;">See how a purchase affects your daily allowance without logging it.</p>
        <form id="dash-simulator-form" style="display: flex; gap: 8px;">
          <div class="input-wrap" style="flex: 1;">
            <span class="input-currency" aria-hidden="true">₹</span>
            <input type="number" id="dash-sim-input" class="text-input has-currency" placeholder="Amount" step="1" required />
          </div>
          <button type="submit" class="btn btn-secondary">Simulate</button>
        </form>
        <div id="dash-sim-result" style="margin-top: 16px; display: none; padding: 12px; background: rgba(255,255,255,0.03); border-radius: 8px;">
          <span style="color: var(--color-ink-muted); font-size: 0.85rem;">New allowance: </span>
          <span id="dash-sim-new-allowance" style="font-weight: 600; color: var(--color-ink);"></span>
        </div>
      </div>
    </div>

    <!-- Recent Transactions -->
    <div style="margin-top: 32px; display: flex; justify-content: space-between; align-items: baseline;">
      <h3 class="section-heading">Recent Transactions</h3>
      <a href="app.html?view=transactions" class="btn btn-secondary" style="padding: 4px 12px; font-size: 0.8rem;">View All</a>
    </div>
    <div class="card" style="margin-top: 16px; padding: 8px var(--space-6);">
      <div class="txn-list" id="dash-txn-list">
        <!-- Injected via JS -->
      </div>
    </div>
  </template>

  <template id="tpl-transactions">
    <div style="max-width: 600px; margin: 0 auto; width: 100%;">
      <h1 class="page-title" style="margin-bottom: 24px;">Transactions</h1>
      <div id="transactions-list" class="card" style="padding: 0;"></div>
    </div>
  </template>

  <template id="tpl-budget">
    <div style="max-width: 600px; margin: 0 auto; width: 100%;">
      <p class="page-eyebrow">Financial Plan</p>
      <h1 class="page-title">Current Budget</h1>
      <p class="page-lede" style="margin-bottom: 24px;">Your current cycle configuration and fund allocation.</p>

      <div class="summary-grid" style="grid-template-columns: 1fr 1fr; margin-bottom: 24px;">
        <div class="summary-item card">
          <span class="summary-label">Cycle Start</span>
          <span class="summary-val" id="budget-start" style="font-size: 1.25rem;"></span>
        </div>
        <div class="summary-item card">
          <span class="summary-label">Cycle End</span>
          <span class="summary-val" id="budget-end" style="font-size: 1.25rem;"></span>
        </div>
      </div>

      <div class="card" style="margin-bottom: 24px; display: flex; flex-direction: column; gap: 16px;">
        <h3 style="margin: 0; color: var(--color-ink); font-size: 1.1rem; font-weight: 500;">Allocation Breakdown</h3>
        
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="color: var(--color-ink-muted);">Starting Balance</span>
          <span id="budget-total" style="font-weight: 600; font-size: 1.1rem;">₹0</span>
        </div>
        
        <div style="height: 12px; border-radius: 6px; background: rgba(255,255,255,0.05); display: flex; overflow: hidden; margin: 8px 0;">
          <div id="budget-bar-fixed" style="height: 100%; background: var(--color-ink-muted); transition: width 0.3s ease;"></div>
          <div id="budget-bar-goals" style="height: 100%; background: var(--color-accent); transition: width 0.3s ease;"></div>
          <div id="budget-bar-flex" style="height: 100%; background: var(--color-primary); transition: width 0.3s ease;"></div>
        </div>
        
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <div style="width: 10px; height: 10px; border-radius: 2px; background: var(--color-ink-muted);"></div>
              <span style="color: var(--color-ink-muted);">Fixed Expenses</span>
            </div>
            <span id="budget-fixed">₹0</span>
          </div>
          
          <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <div style="width: 10px; height: 10px; border-radius: 2px; background: var(--color-accent);"></div>
              <span style="color: var(--color-ink-muted);">Savings Goals</span>
            </div>
            <span id="budget-goals">₹0</span>
          </div>
          
          <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <div style="width: 10px; height: 10px; border-radius: 2px; background: var(--color-primary);"></div>
              <span style="color: var(--color-ink-muted);">Flexible Pool</span>
            </div>
            <span id="budget-flexible" style="color: var(--color-primary); font-weight: 500;">₹0</span>
          </div>
        </div>
      </div>
      
      <a href="app.html?view=setup" class="btn btn-outline" style="display: block; width: 100%; text-align: center; text-decoration: none;">Start New Cycle</a>
    </div>
  </template>

  <template id="tpl-goals">
    <div style="max-width: 600px; margin: 0 auto; width: 100%;">
      <p class="page-eyebrow">Savings</p>
      <h1 class="page-title">Your Goals</h1>
      
      <div class="card" style="margin-top: 24px;">
        <div id="goals-list" style="margin-bottom: 24px;">
          <!-- Injected via JS -->
        </div>

        <form id="goal-form" style="display: flex; flex-direction: column; gap: 12px; align-items: stretch; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 24px;">
          <h4 style="margin: 0; color: var(--color-ink);">Add a Goal</h4>
          <div style="display: flex; gap: 12px;">
            <div class="field" style="flex: 2; margin-bottom: 0;">
              <input type="text" id="goal-name" class="text-input" placeholder="e.g. New Laptop" required />
            </div>
            <div class="field" style="flex: 1; margin-bottom: 0;">
              <div class="input-wrap">
                <span class="input-currency" aria-hidden="true">₹</span>
                <input type="number" id="goal-target" class="text-input has-currency" placeholder="Target" min="0" step="1" required />
              </div>
            </div>
            <button type="submit" class="btn btn-primary">Add</button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <template id="tpl-insights">
    <div style="max-width: 600px; margin: 0 auto; width: 100%;">
      <p class="page-eyebrow">Analytics</p>
      <h1 class="page-title">Your Insights</h1>
      <p class="page-lede" style="margin-bottom: 24px;">Based on your confirmed spending patterns.</p>
      
      <div class="summary-grid" style="grid-template-columns: 1fr 1fr; margin-bottom: 24px;">
        <div class="summary-item card">
          <div class="summary-item-label" style="font-size: 0.9rem; color: var(--color-ink-muted);">Average Daily Spend</div>
          <div class="summary-item-value" id="insight-avg-spend" style="font-size: 1.5rem; color: var(--color-ink); margin-top: 8px;">₹0</div>
        </div>
        <div class="summary-item card">
          <div class="summary-item-label" style="font-size: 0.9rem; color: var(--color-ink-muted);">Total Spent</div>
          <div class="summary-item-value" id="insight-total-spent" style="font-size: 1.5rem; color: var(--color-ink); margin-top: 8px;">₹0</div>
        </div>
        <div class="summary-item card" style="grid-column: 1 / -1;">
          <div class="summary-item-label" style="font-size: 0.9rem; color: var(--color-ink-muted);">Projected Zero Day</div>
          <div class="summary-item-value" id="insight-zero-day" style="font-size: 1.25rem; color: var(--color-primary); margin-top: 8px;">Need more data</div>
          <div style="font-size: 0.85rem; color: var(--color-ink-muted); margin-top: 4px;">At your current burn rate</div>
        </div>
      </div>

      <div class="card" style="margin-bottom: 24px; padding: 24px;">
        <h3 class="section-heading" style="margin-bottom: 16px;">Category Breakdown</h3>
        <div id="insight-category-breakdown">
          <!-- Injected via JS -->
        </div>
      </div>
    </div>
  </template>

  <template id="tpl-settings">
    <div style="max-width: 600px; margin: 0 auto; width: 100%;">
      <p class="page-eyebrow">Settings</p>
      <h1 class="page-title">Manage your account</h1>
      
      <div class="card" style="margin-top: 24px; padding: 24px;">
        <h3 class="section-heading" style="margin-bottom: 16px;">Fixed Commitments</h3>
        <p style="color: var(--color-ink-muted); margin-bottom: 16px; font-size: 0.95rem;">
          Set up your recurring expenses (rent, utilities, subscriptions). These will automatically be deducted from your available money when setting up a new budget cycle.
        </p>
        <a href="app.html?view=recurring" class="btn btn-primary" data-route="recurring">Manage Recurring Expenses</a>
      </div>

      <div class="card" style="margin-top: 24px; padding: 24px;">
        <h3 class="section-heading" style="margin-bottom: 16px;">Account</h3>
        <button class="btn btn-secondary is-signout">Sign Out</button>
      </div>
    </div>
  </template>

  <template id="tpl-recurring">
    <div style="max-width: 600px; margin: 0 auto; width: 100%;">
      <p class="page-eyebrow">Fixed Commitments</p>
      <h1 class="page-title">Recurring Expenses</h1>
      <p class="page-lede">These will be automatically applied as fixed costs to any new budget cycle.</p>
      
      <div class="card" style="margin-top: 24px;">
        <div id="recurring-list" class="txn-list" style="margin-bottom: 24px;">
          <!-- Injected via JS -->
        </div>

        <form id="recurring-form" style="display: flex; gap: 12px; align-items: flex-end;">
          <div class="field" style="flex: 2; margin-bottom: 0;">
            <label class="field-label" for="recurring-name">Name</label>
            <input type="text" id="recurring-name" class="text-input" placeholder="e.g. Netflix" required />
          </div>
          <div class="field" style="flex: 1; margin-bottom: 0;">
            <label class="field-label" for="recurring-amount">Amount</label>
            <div class="input-wrap">
              <span class="input-currency" aria-hidden="true">₹</span>
              <input type="number" id="recurring-amount" class="text-input has-currency" placeholder="0" min="0" step="1" required />
            </div>
          </div>
          <button type="submit" class="btn btn-primary" style="height: 48px;">Add</button>
        </form>
      </div>
    </div>
  </template>

  <script src="js/PocketPilot_Engine.js"></script>
  <script type="module" src="js/script.js"></script>
</body>
</html>
